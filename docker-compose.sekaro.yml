name: sekaro

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sekaro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sekaro
    volumes:
      - sekaro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sekaro -d sekaro"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sekaro-internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sekaro:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sekaro:${POSTGRES_PASSWORD}@db:5432/sekaro
      QUICKLY_LOCAL_DISK_BACKUPS: "1"
      QUICKLY_MODE: production
    ports:
      - "127.0.0.1:${SEKARO_PORT:-5050}:8000"
    volumes:
      - ./backups:/app/backups
    networks:
      - sekaro-internal

networks:
  sekaro-internal:
    name: sekaro-internal

volumes:
  sekaro_pgdata:
    name: sekaro_pgdata

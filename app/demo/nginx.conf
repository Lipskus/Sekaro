worker_processes 1;
events { worker_connections 256; }
http {
    access_log off;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 valid=5s ipv6=off;
    map $http_x_forwarded_proto $demo_scheme {
        default $http_x_forwarded_proto;
        "" $scheme;
    }
    server {
        listen 8080;
        client_max_body_size 64m;
        location / {
            # Resolve again after app recreation; no hard-coded container IP.
            set $demo_backend http://demo-app:8000;
            proxy_pass $demo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $demo_scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}

# Include inside the TLS server for the dedicated public unsubscribe hostname.
# Never forward this hostname to the private panel on port 5050.
# Configure certificates and a request-rate policy in your host proxy.
location ~ ^/u/[A-Za-z0-9_-]{20,64}$ {
    limit_except GET POST { deny all; }
    proxy_pass http://127.0.0.1:5051;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 1k;
    access_log off;
}
location / { return 404; }
